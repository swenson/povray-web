; POV-Ray system INI file for the web build.
;
; This file lives at /povray/etc/povray.ini in the in-browser file system.
; Options typed in the web UI are passed on the command line and override
; anything set here.

; Standard include files (colors.inc, textures.inc, ...).
Library_Path=/povray/include

; Bundled INI files (quickres.ini, res640.ini, ...).
Library_Path=/povray/ini

; Defaults suited to the browser front-end.
Output_File_Type=N
Display=On
Verbose=On
Antialias_Threshold=0.3
